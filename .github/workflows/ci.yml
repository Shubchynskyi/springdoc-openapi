name: Manual springdoc verification

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact springdoc source commit to test
        required: true
        type: string
      modules:
        description: Maven modules for a filtered retry; empty runs the full reactor
        required: false
        default: ''
        type: string
      tests:
        description: Surefire test selector for a filtered retry; empty runs all tests
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: manual-springdoc-${{ github.run_id }}
  cancel-in-progress: false

env:
  MAVEN_OPTS: -Xmx3g

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate source commit
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record tested source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$SOURCE_SHA"
          printf 'Tested source: `%s`\n' "$actual_sha" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Test
        shell: bash
        env:
          MAVEN_PROJECTS: ${{ inputs.modules }}
          TEST_SELECTOR: ${{ inputs.tests }}
        run: |
          args=(-B -V --no-transfer-progress -Dmaven.artifact.threads=16 -Pci -T1C -DskipPublishing=true)
          if [[ -n "$MAVEN_PROJECTS" ]]; then
            args+=(-pl "$MAVEN_PROJECTS" -am)
          fi
          if [[ -n "$TEST_SELECTOR" ]]; then
            args+=("-Dtest=$TEST_SELECTOR" -Dsurefire.failIfNoSpecifiedTests=false)
          fi
          ./mvnw "${args[@]}" test
